<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fiverr Scraper</title>
<style>
  /* Fiverr palette: green #1DBF73, ink #222325, grays #404145 / #74767E / #E4E5E7 / #F7F7F7.
     Green marks gig things only (badges, category text, left rule). Profiles use ink. */
  :root {
    --paper: #f7f7f7;
    --surface: #ffffff;
    --ink: #222325;
    --ink-soft: #404145;
    --muted: #74767e;
    --line: #e4e5e7;
    --green: #1dbf73;
    --green-ink: #095933;
    --green-wash: #e3f7ec;
    --green-rule: #8addb4;
    --ink-wash: #ececed;
    --danger: #d9342b;
    --danger-dark: #b8281f;
    --danger-wash: #fdecea;
    --warn: #b8860b;
    --warn-wash: #fff4d6;
    --focus: #095933;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    width: 420px;
    min-height: 240px;
    max-height: 600px;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 12px;
    background: var(--surface);
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header h1 .dot { color: var(--green); }
  #totalCount {
    display: block;
    margin-top: 1px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .header-actions { display: flex; align-items: center; gap: 4px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    font-weight: 600;
    transition: background-color 0.12s ease, transform 0.08s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover { background: var(--ink-soft); }
  .btn.danger { color: var(--danger); font-weight: 500; }
  .btn.danger:hover { background: var(--danger-wash); }
  .btn:not(.primary):not(.danger) { border-color: var(--line); background: var(--surface); }
  .btn:not(.primary):not(.danger):hover { background: var(--paper); }
  /* filled red, used only by the confirm dialog's destructive button */
  .btn.primary.danger-fill { background: var(--danger); }
  .btn.primary.danger-fill:hover { background: var(--danger-dark); }

  /* ---------- search ---------- */
  #searchWrap {
    position: relative;
    padding: 0 16px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  #searchWrap svg {
    position: absolute;
    left: 27px;
    top: 9px;
    color: var(--muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    height: 34px;
    padding: 0 10px 0 32px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font: inherit;
  }
  #searchInput::placeholder { color: var(--muted); }
  #searchInput:focus { background: var(--surface); }

  /* ---------- category filters ---------- */
  #filters {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .chip {
    padding: 3px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .chip:hover { color: var(--ink); background: var(--paper); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- selection ---------- */
  input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin: 0;
    flex-shrink: 0;
    accent-color: var(--green);
    cursor: pointer;
  }
  #selectRow {
    display: none;
    align-items: center;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  #selectRow label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  #selectionBar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: 0 -4px 12px rgba(34, 35, 37, 0.06);
  }
  #selectionBar.show { display: flex; }
  #selectionCount { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-actions { display: flex; align-items: center; gap: 6px; }
  .seller-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .item-check { position: absolute; left: 10px; top: 11px; }

  /* ---------- list ---------- */
  #list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    background: var(--surface);
  }

  .empty-state {
    margin: 16px;
    padding: 28px 20px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .seller-group { border-bottom: 1px solid var(--line); }

  .seller-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  .seller-header:hover { background: var(--paper); }
  .seller-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 600;
  }
  .seller-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .badge {
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .gig-badge { background: var(--green-wash); color: var(--green-ink); }
  .profile-badge { background: var(--ink-wash); color: var(--ink); }

  .chevron {
    display: inline-flex;
    margin-left: 2px;
    color: var(--muted);
    transition: transform 0.18s ease;
  }
  .seller-group.expanded .chevron { transform: rotate(90deg); }

  /* expanded items: a green rule on the left shows they belong to the seller above */
  .items {
    max-height: 0;
    overflow: hidden;
    visibility: hidden;
    margin: 0 12px 0 22px;
    border-left: 2px solid var(--green-rule);
    transition: max-height 0.22s ease, visibility 0s 0.22s;
  }
  .seller-group.expanded .items {
    max-height: 2400px;
    visibility: visible;
    margin-bottom: 10px;
    transition: max-height 0.22s ease, visibility 0s;
  }

  /* Item = title on its own full-width line (2 lines max), then meta on the
     left and actions on the right. .item-info is "display: contents" so its
     title + meta children take part in the .item grid directly. */
  .item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 8px;
    position: relative;
    padding: 9px 4px 5px 34px;
    border-radius: 0 8px 8px 0;
    transition: background-color 0.12s ease;
  }
  .item:hover { background: var(--paper); }
  .item-info { display: contents; }
  .item-title {
    grid-column: 1 / -1;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    font-weight: 550;
    line-height: 1.35;
  }
  .item-meta {
    grid-column: 1;
    display: flex;
    gap: 10px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    color: var(--muted);
    font-size: 11px;
  }
  .item-category { overflow: hidden; text-overflow: ellipsis; color: var(--green-ink); }
  .item-kind { color: var(--ink); font-weight: 600; }

  .item-actions { grid-column: 2; display: flex; gap: 1px; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .icon-btn:hover { background: var(--line); color: var(--ink); }
  .icon-btn.done { color: var(--green-ink); background: var(--green-wash); }
  .icon-btn.warn-btn { color: var(--warn); background: var(--warn-wash); }
  .icon-btn.warn-btn:hover { background: #ffe9a8; color: var(--warn); }
  .icon-btn.delete-btn { margin-left: 6px; }
  .icon-btn.delete-btn:hover { background: var(--danger-wash); color: var(--danger); }

  /* ---------- markdown viewer ---------- */
  #viewerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    background: var(--surface);
    z-index: 10;
  }
  #viewerOverlay.open { display: flex; }
  .viewer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .viewer-actions { display: flex; gap: 6px; flex-shrink: 0; }
  #viewerTitle {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  #viewerBody {
    flex: 1;
    margin: 0;
    padding: 14px 16px;
    overflow: auto;
    scrollbar-width: thin;
    background: var(--paper);
    white-space: pre-wrap;
    word-break: break-word;
    font: 12px/1.6 "Cascadia Mono", Consolas, ui-monospace, monospace;
  }

  /* ---------- confirm dialog (replaces the browser's native confirm) ---------- */
  #dialogOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(34, 35, 37, 0.55);
  }
  #dialogOverlay.open { display: flex; }
  .dialog {
    width: 100%;
    max-width: 340px;
    padding: 18px 18px 14px;
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  }
  .dialog h2 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .dialog p { margin: 0; color: var(--ink-soft); line-height: 1.5; }
  .dialog p + p { margin-top: 4px; color: var(--muted); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 14px;
    z-index: 30;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Fiverr Scraper<span class="dot">.</span></h1>
      <span id="totalCount"></span>
    </div>
    <div class="header-actions">
      <button class="btn danger" id="clearAllBtn">Clear</button>
      <button class="btn primary" id="downloadAllBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download all
      </button>
    </div>
  </header>

  <div id="searchWrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" placeholder="Search sellers or gigs" autocomplete="off" aria-label="Search sellers or gigs">
  </div>

  <div id="filters"></div>

  <div id="selectRow">
    <label><input type="checkbox" id="selectAll" aria-label="Select all shown items"> Select all</label>
  </div>

  <div id="list"></div>

  <div id="selectionBar">
    <span id="selectionCount"></span>
    <div class="bar-actions">
      <button class="btn" id="deselectBtn">Deselect</button>
      <button class="btn primary" id="downloadSelectedBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download selected
      </button>
    </div>
  </div>

  <div id="viewerOverlay">
    <div class="viewer-head">
      <span id="viewerTitle"></span>
      <div class="viewer-actions">
        <button class="btn" id="viewerCopyBtn">Copy</button>
        <button class="btn" id="viewerCloseBtn">Close</button>
      </div>
    </div>
    <pre id="viewerBody"></pre>
  </div>

  <div id="dialogOverlay">
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMsg">
      <h2 id="dialogTitle"></h2>
      <p id="dialogMsg"></p>
      <p id="dialogNote"></p>
      <div class="dialog-actions">
        <button class="btn" id="dialogCancel">Cancel</button>
        <button class="btn primary danger-fill" id="dialogConfirm">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
